[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filemind"
version = "0.1.0"
description = "An AI-powered local file intelligence toolkit — scan, search, Q&A, summarize, and organize your files"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FileMind contributors"}
]
keywords = ["ai", "agent", "rag", "file-management", "semantic-search", "document-qa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "sentence-transformers>=3.0.0,<6.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# Full parser support (PDF, DOCX, images)
parsers = [
    "PyMuPDF>=1.25.0",
    "python-docx>=1.1.0,<2.0.0",
]
# Dev / test
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
filemind = "filemind.__main__:main"

[tool.setuptools.packages.find]
include = ["filemind*"]
